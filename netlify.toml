[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The service worker decides which build every returning visitor runs. Cached
# even briefly, it pins people to an old version of the site, so it is the one
# file that must always be revalidated.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Everything under /assets carries a content hash in its name, so it can be
# kept for a year without ever going stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
